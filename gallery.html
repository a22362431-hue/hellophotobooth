  <nav class="sub-nav">

      <strong>尾牙作品即將上傳</strong>
      敬請期待，或聯絡我們了解更多
    </div>
    <!-- 新增尾牙照片 -->

  <div class="cta-strip">
    <h2>喜歡我們的作品？</h2>
    <p>立即聯絡我們，為您的活動量身打造專屬拍貼體驗</p>
    <a href="index.html#contact">聯絡我們・立即預約</a>
  </div>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox" onclick="closeLightbox()">
    <span class="lightbox-close">&times;</span>
    <img id="lightbox-img" src="" alt="">
  </div>

  <script>
    // Category tabs
    document.querySelectorAll('.cat-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.cat-tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.photo-section').forEach(s => s.classList.remove('active'));
        tab.classList.add('active');
        document.getElementById('cat-' + tab.dataset.cat).classList.add('active');
      });
    });

    // Lightbox
    function openLightbox(el) {
      const img = el.querySelector('img');
      document.getElementById('lightbox-img').src = img.src;
      document.getElementById('lightbox').classList.add('open');
    }
    function closeLightbox() {
      document.getElementById('lightbox').classList.remove('open');
    }
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLightbox(); });
  </script>
</body>
</html>
